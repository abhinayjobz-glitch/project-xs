// ── HELPERS ───────────────────────────────────────────────────────────────────
function useLocalStorage(key, initial) {
  const [state, setState] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : initial; }
    catch { return initial; }
  });
  const set = useCallback(v => { setState(v); try { localStorage.setItem(key, JSON.stringify(v)); } catch {} }, [key]);
  return [state, set];
}

function CourierBadge({ courier }) {
  const map = { DPD: "badge-dpd", InPost: "badge-inpost", GLS: "badge-gls", DHL: "badge-dhl", UPS: "badge-ups", "ORLEN Paczka": "badge-orlen" };
  return <span className={`inline-block px-2 py-0.5 rounded text-xs font-bold ${map[courier] || "bg-gray-200 text-gray-700"}`}>{courier}</span>;
}

function StatusBadge({ status }) {
  const map = { Open: "dispute-open", Submitted: "dispute-submitted", Won: "dispute-won", Lost: "dispute-lost" };
  if (!status) return <span className="text-gray-400 text-sm">—</span>;
  return <span className={map[status] || "text-gray-600"}>{status}</span>;
}

    <div>
      <h1 className="text-2xl font-bold text-gray-800 mb-2">Spory Kurierskie / Courier Disputes</h1>
      <p className="text-gray-500 text-sm mb-6">Zarządzaj sporami z DPD, GLS, InPost i innymi. Wiersze czerwone = potwierdzona nadpłata.</p>

      <div className="grid grid-cols-3 gap-4 mb-6">
        {["Open","Submitted","Won"].map(s => {
          const count = disputes.filter(d => d.dispute_status === s).length;
          const amt = disputes.filter(d => d.dispute_status === s).reduce((a,d) => a + (d.dispute_amount||0), 0);
          return (
            <div key={s} className="stat-card text-center">
              <div className={`text-2xl font-bold ${s==="Open"?"text-red-600":s==="Submitted"?"text-yellow-600":"text-green-600"}`}>{count}</div>
              <div className="text-sm text-gray-500">{s}</div>
              {amt > 0 && <div className="text-xs text-gray-400">{amt.toFixed(2)} PLN</div>}
            </div>
          );
        })}
      </div>

      <div className="bg-white rounded-xl shadow-sm overflow-hidden">
        <table className="w-full text-sm">
          <thead className="bg-gray-50 text-gray-500 text-xs">
            <tr>
              <th className="text-left px-4 py-3">Zamówienie</th>
              <th className="text-left px-4 py-3">Klient</th>
              <th className="text-left px-4 py-3">Kurier</th>
              <th className="text-left px-4 py-3">Zadeklarowana waga</th>
              <th className="text-left px-4 py-3">Naliczona waga</th>
              <th className="text-left px-4 py-3">Różnica</th>
              <th className="text-left px-4 py-3">Nadpłata</th>
              <th className="text-left px-4 py-3">Status</th>
              <th className="text-left px-4 py-3"></th>
            </tr>
          </thead>
          <tbody>
            {disputes.map(o => {
              const diff = (o.weight_billed - o.weight_declared).toFixed(2);
              const flagged = isOvercharged(o);
              return (
                <tr key={o.id} className={`table-row border-t ${flagged && o.dispute_status === "Open" ? "bg-red-50" : ""}`}>
                  <td className="px-4 py-3 font-mono font-semibold text-blue-700">{o.id}</td>
                  <td className="px-4 py-3 text-gray-600">{o.customer}</td>
                  <td className="px-4 py-3"><CourierBadge courier={o.courier} /></td>
                  <td className="px-4 py-3">{o.weight_declared} kg</td>
                  <td className="px-4 py-3 font-semibold">{o.weight_billed} kg</td>
                  <td className={`px-4 py-3 font-bold ${diff > 0 ? "text-red-600" : "text-green-600"}`}>{diff > 0 ? `+${diff}` : diff} kg {diff > 0 && "🚨"}</td>
                  <td className="px-4 py-3 font-bold text-red-600">{o.dispute_amount > 0 ? `${o.dispute_amount.toFixed(2)} PLN` : "—"}</td>
                  <td className="px-4 py-3"><StatusBadge status={o.dispute_status} /></td>
                  <td className="px-4 py-3"><button onClick={() => openEdit(o)} className="btn-secondary text-xs py-1 px-2">Edytuj</button></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* Edit modal */}
      {editing && (
        <div className="modal-overlay" onClick={() => setEditing(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h2 className="text-lg font-bold text-gray-800 mb-4">Edytuj spór — {editing.id}</h2>
            <div className="grid grid-cols-2 gap-4 mb-4">
              <div>
                <label className="block text-xs text-gray-500 mb-1">Waga zadeklarowana (kg)</label>
                <input type="number" step="0.1" value={editing.weight_declared} onChange={e => setEditing({...editing, weight_declared: parseFloat(e.target.value)||0})} />
              </div>
              <div>
                <label className="block text-xs text-gray-500 mb-1">Waga naliczona (kg)</label>
                <input type="number" step="0.1" value={editing.weight_billed} onChange={e => setEditing({...editing, weight_billed: parseFloat(e.target.value)||0})} />
              </div>
              <div>
                <label className="block text-xs text-gray-500 mb-1">Kwota nadpłaty (PLN)</label>
                <input type="number" step="0.01" value={editing.dispute_amount} onChange={e => setEditing({...editing, dispute_amount: parseFloat(e.target.value)||0})} />
              </div>
              <div>
                <label className="block text-xs text-gray-500 mb-1">Status sporu</label>
                <select value={editing.dispute_status||""} onChange={e => setEditing({...editing, dispute_status: e.target.value||null})}>
                  <option value="">Brak sporu</option>
                  <option value="Open">Open — w toku</option>
                  <option value="Submitted">Submitted — złożony</option>
                  <option value="Won">Won — wygrany</option>
                  <option value="Lost">Lost — przegrany</option>
                </select>
              </div>
            </div>
            <div className="mb-4">
              <label className="block text-xs text-gray-500 mb-1">Notatki / dowody</label>
              <textarea rows={3} value={editing.notes} onChange={e => setEditing({...editing, notes: e.target.value})} className="resize-none" />
            </div>
            <div className="mb-4">
              <label className="block text-xs text-gray-500 mb-1">Wymiary zadeklarowane (DxSxW cm)</label>
              <input value={editing.dims_declared} onChange={e => setEditing({...editing, dims_declared: e.target.value})} />
            </div>
            <div className="mb-6">
              <label className="block text-xs text-gray-500 mb-1">Wymiary naliczone przez kuriera</label>
              <input value={editing.dims_billed} onChange={e => setEditing({...editing, dims_billed: e.target.value})} />
            </div>
            <div className="bg-blue-50 rounded p-3 mb-4 text-xs text-blue-700">
              <strong>Dowody do zgromadzenia:</strong> Zdjęcie paczki na wadze • Zdjęcie wymiarów (taśma miernicza) • Etykieta kurierska • Faktura kurierska (PDF) • Potwierdzenie zlecenia wysyłki
            </div>
            <div className="flex gap-3">
              <button onClick={saveEdit} className="btn-primary">Zapisz zmiany</button>
              <button onClick={() => setEditing(null)} className="btn-secondary">Anuluj</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── COURIER STATS ─────────────────────────────────────────────────────────────
function CourierStats({ orders }) {
  const couriers = ["DPD", "InPost", "GLS", "DHL", "UPS", "ORLEN Paczka"];
  const stats = couriers.map(c => {
    const co = orders.filter(o => o.courier === c);
    const disputes = co.filter(o => o.dispute_amount > 0);
    const won = co.filter(o => o.dispute_status === "Won");
    const open = co.filter(o => o.dispute_status === "Open");
    const totalOvercharge = disputes.reduce((s, o) => s + (o.dispute_amount || 0), 0);
    return { courier: c, total: co.length, disputes: disputes.length, open: open.length, won: won.length, overcharge: totalOvercharge };
  }).filter(s => s.total > 0);

  return (
    <div>
      <h1 className="text-2xl font-bold text-gray-800 mb-6">Statystyki Kurierów / Courier Performance</h1>
      <div className="grid gap-4">
        {stats.map(s => (
          <div key={s.courier} className={`bg-white rounded-xl p-5 shadow-sm border-l-4 ${s.overcharge > 0 ? "border-red-400" : "border-green-400"}`}>
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-center gap-3">
                <CourierBadge courier={s.courier} />
                <span className="font-semibold text-gray-700 text-base">{s.courier}</span>
              </div>
              {s.overcharge > 0 && <span className="text-red-600 font-bold">{s.overcharge.toFixed(2)} PLN nadpłaty</span>}
            </div>
            <div className="grid grid-cols-4 gap-4 text-center">
              <div><div className="text-xl font-bold text-gray-700">{s.total}</div><div className="text-xs text-gray-400">Przesyłki</div></div>
              <div><div className={`text-xl font-bold ${s.disputes > 0 ? "text-red-500" : "text-green-500"}`}>{s.disputes}</div><div className="text-xs text-gray-400">Spory</div></div>
              <div><div className={`text-xl font-bold ${s.open > 0 ? "text-red-500" : "text-gray-500"}`}>{s.open}</div><div className="text-xs text-gray-400">Otwarte</div></div>
              <div><div className="text-xl font-bold text-green-600">{s.won}</div><div className="text-xs text-gray-400">Wygrane</div></div>
            </div>
            {s.disputes > 0 && (
              <div className="mt-3 pt-3 border-t border-gray-100">
                <div className="text-xs text-gray-500">Win rate: <span className="font-semibold">{s.disputes > 0 ? Math.round((s.won/s.disputes)*100) : 0}%</span> | Śr. nadpłata: <span className="font-semibold">{s.disputes > 0 ? (s.overcharge/s.disputes).toFixed(2) : 0} PLN/spór</span></div>
              </div>
            )}
          </div>
        ))}
      </div>

      <div className="bg-white rounded-xl p-6 shadow-sm mt-6">
        <h2 className="font-semibold text-gray-700 mb-3">Instrukcja zbierania dowodów / Evidence Collection Checklist</h2>
        <div className="space-y-2 text-sm text-gray-600">
          {["Przed wysyłką: zrób zdjęcie paczki na wadze (waga widoczna)","Przed wysyłką: zrób zdjęcie wymiarów taśmą mierniczą","Zachowaj PDF potwierdzenia zlecenia z wagą i wymiarami","Zachowaj etykietę kurierską (zdjęcie lub PDF)","Po otrzymaniu faktury: porównaj wagę zadeklarowaną vs naliczoną","Jeśli różnica > 0 kg — otwórz spór w systemie kuriera w ciągu 7 dni"].map((s,i) => (
            <div key={i} className="flex items-start gap-2">
              <span className="text-blue-600 font-bold mt-0.5">{i+1}.</span>
              <span>{s}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── INVENTORY ─────────────────────────────────────────────────────────────────
function Inventory({ inventory, setInventory }) {
  const getStatusBadge = (i) => {
    if (i.status === "PRE_ORDER_BUG") return <span className="px-2 py-0.5 rounded text-xs font-bold bg-red-600 text-white">🐛 PRE-ORDER BUG</span>;
    if (i.status === "NO_BUY_BUTTON") return <span className="px-2 py-0.5 rounded text-xs font-bold bg-red-500 text-white">🐛 BRAK PRZYCISKU</span>;
    if (i.status === "LOW_STOCK") return <span className="px-2 py-0.5 rounded text-xs font-bold bg-yellow-400 text-yellow-900">⚠️ NISKI STAN</span>;
    return <span className="px-2 py-0.5 rounded text-xs bg-green-100 text-green-700">✅ OK</span>;
  };

  const sorted = [...inventory].sort((a,b) => b.units_sold_30d - a.units_sold_30d);

  return (
    <div>
      <h1 className="text-2xl font-bold text-gray-800 mb-6">Stany Magazynowe / Inventory</h1>

      <div className="grid grid-cols-3 gap-4 mb-6">
        <div className="stat-card"><div className="text-2xl font-bold text-red-600">{inventory.filter(i=>i.stock===0).length}</div><div className="text-sm text-gray-500">Brak towaru (0 szt.)</div></div>
        <div className="stat-card"><div className="text-2xl font-bold text-yellow-500">{inventory.filter(i=>i.status==="LOW_STOCK").length}</div><div className="text-sm text-gray-500">Niski stan</div></div>
        <div className="stat-card"><div className="text-2xl font-bold text-red-600">{inventory.filter(i=>i.status==="PRE_ORDER_BUG"||i.status==="NO_BUY_BUTTON").length}</div><div className="text-sm text-gray-500">Błędy strony www</div></div>
      </div>

      <div className="bg-white rounded-xl shadow-sm overflow-hidden">
        <table className="w-full text-sm">
          <thead className="bg-gray-50 text-gray-500 text-xs">
            <tr>
              <th className="text-left px-4 py-3">SKU</th>
              <th className="text-left px-4 py-3">Produkt</th>
              <th className="text-left px-4 py-3">Kategoria</th>
              <th className="text-left px-4 py-3">Stan</th>
              <th className="text-left px-4 py-3">Min. reorder</th>
              <th className="text-left px-4 py-3">Sprzedano 30d</th>
              <th className="text-left px-4 py-3">Status</th>
            </tr>
          </thead>
          <tbody>
            {sorted.map(i => (
              <tr key={i.sku} className={`table-row border-t ${i.stock===0?"bg-red-50":i.status==="LOW_STOCK"?"bg-yellow-50":""}`}>
                <td className="px-4 py-3 font-mono text-xs text-gray-400">{i.sku}</td>
                <td className="px-4 py-3 font-medium text-gray-700">{i.name}</td>
                <td className="px-4 py-3 text-gray-500 text-xs">{i.category}</td>
                <td className={`px-4 py-3 font-bold ${i.stock===0?"text-red-600":i.stock<i.reorder_point?"text-yellow-600":"text-green-600"}`}>{i.stock} szt.</td>
                <td className="px-4 py-3 text-gray-400 text-xs">{i.reorder_point} szt.</td>
                <td className="px-4 py-3 text-gray-600">{i.units_sold_30d} szt.</td>
                <td className="px-4 py-3">
                  {getStatusBadge(i)}
                  {i.note && <div className="text-xs text-gray-400 mt-1 max-w-xs truncate" title={i.note}>{i.note}</div>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 mt-4 text-sm text-amber-800">
        <strong>Ważne — China Lead Time:</strong> Standardowy czas dostawy z Chin: 50–70 dni. Punkt reorder = Śr. dzienna sprzedaż × 65 dni + zapas bezpieczeństwa. Excel: <code className="bg-amber-100 px-1 rounded">=1.65*STDEV(sprzedaż_90d)*SQRT(65)</code> &nbsp;|&nbsp; <strong>Chiński Nowy Rok 2027: 29 stycznia</strong> — zamów do 20 listopada 2026!
      </div>
    </div>
  );
}

// ── B2B ───────────────────────────────────────────────────────────────────────
function B2B({ b2b, setB2b }) {
  const [adding, setAdding] = useState(false);
  const [form, setForm] = useState({ company: "", contact: "", email: "", type: "Fashion School", city: "", status: "Prospect", monthly_spend: 0, notes: "" });

  const addClient = () => {
    if (!form.company) return;
    setB2b([...b2b, { ...form, id: Date.now(), last_order: null, monthly_spend: Number(form.monthly_spend)||0 }]);
    setAdding(false);
    setForm({ company: "", contact: "", email: "", type: "Fashion School", city: "", status: "Prospect", monthly_spend: 0, notes: "" });
  };

  const totalMonthly = b2b.filter(b => b.status === "Active").reduce((s, b) => s + (b.monthly_spend||0), 0);

  const statusColor = { Active: "bg-green-100 text-green-700", Pending: "bg-yellow-100 text-yellow-700", Prospect: "bg-blue-100 text-blue-700", Inactive: "bg-gray-100 text-gray-500" };

  return (
    <div>
      <div className="flex items-center justify-between mb-6">
        <div>
          <h1 className="text-2xl font-bold text-gray-800">Klienci B2B</h1>
          <p className="text-gray-400 text-sm mt-1">Hurtownicy, szkoły mody, firmy — aktywni: {totalMonthly.toLocaleString()} PLN/mies.</p>
        </div>
        <button onClick={() => setAdding(true)} className="btn-primary">+ Dodaj klienta</button>
      </div>

      <div className="grid grid-cols-2 gap-4 mb-6">
        <div className="stat-card"><div className="text-2xl font-bold text-green-600">{b2b.filter(b=>b.status==="Active").length}</div><div className="text-sm text-gray-500">Aktywni klienci</div><div className="text-xs text-green-500">{totalMonthly.toLocaleString()} PLN/mies.</div></div>
        <div className="stat-card"><div className="text-2xl font-bold text-blue-500">{b2b.filter(b=>b.status==="Prospect").length}</div><div className="text-sm text-gray-500">Potencjalni (Prospects)</div><div className="text-xs text-blue-400">do skontaktowania</div></div>
      </div>

      <div className="space-y-3">
        {b2b.map(c => (
          <div key={c.id} className="bg-white rounded-xl p-5 shadow-sm">
            <div className="flex items-start justify-between">
              <div>
                <div className="font-semibold text-gray-800">{c.company}</div>
                <div className="text-gray-500 text-sm">{c.contact} | {c.email} | {c.city}</div>
              </div>
              <div className="flex items-center gap-3">
                {c.monthly_spend > 0 && <span className="text-green-600 font-bold text-sm">{c.monthly_spend.toLocaleString()} PLN/mies.</span>}
                <span className={`px-2 py-0.5 rounded text-xs font-medium ${statusColor[c.status]||"bg-gray-100"}`}>{c.status}</span>
                <span className="px-2 py-0.5 bg-blue-50 text-blue-600 rounded text-xs">{c.type}</span>
              </div>
            </div>
            {c.notes && <div className="mt-2 text-sm text-gray-500 bg-gray-50 rounded p-2">{c.notes}</div>}
            {c.last_order && <div className="mt-1 text-xs text-gray-400">Ostatnie zamówienie: {c.last_order}</div>}
          </div>
        ))}
      </div>

      {adding && (
        <div className="modal-overlay" onClick={() => setAdding(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h2 className="text-lg font-bold text-gray-800 mb-4">Dodaj klienta B2B</h2>
            <div className="space-y-3">
              {[["Nazwa firmy *", "company", "text"], ["Osoba kontaktowa", "contact", "text"], ["E-mail", "email", "email"], ["Miasto", "city", "text"]].map(([lbl, key, type]) => (
                <div key={key}><label className="block text-xs text-gray-500 mb-1">{lbl}</label><input type={type} value={form[key]} onChange={e => setForm({...form, [key]: e.target.value})} /></div>
              ))}
              <div className="grid grid-cols-2 gap-3">
                <div><label className="block text-xs text-gray-500 mb-1">Typ klienta</label>
                  <select value={form.type} onChange={e => setForm({...form, type: e.target.value})}>
                    {["Fashion School","Medical / Scrubs","Army / Military","Furniture / Upholstery","Fashion Brand","Events / Film","Industrial","Workwear","Other"].map(t => <option key={t}>{t}</option>)}
                  </select>
                </div>
                <div><label className="block text-xs text-gray-500 mb-1">Status</label>
                  <select value={form.status} onChange={e => setForm({...form, status: e.target.value})}>
                    {["Prospect","Pending","Active","Inactive"].map(s => <option key={s}>{s}</option>)}
                  </select>
                </div>
              </div>
              <div><label className="block text-xs text-gray-500 mb-1">Śr. miesięczne zakupy (PLN)</label><input type="number" value={form.monthly_spend} onChange={e => setForm({...form, monthly_spend: e.target.value})} /></div>
              <div><label className="block text-xs text-gray-500 mb-1">Notatki</label><textarea rows={2} className="resize-none" value={form.notes} onChange={e => setForm({...form, notes: e.target.value})} /></div>
            </div>
            <div className="flex gap-3 mt-4">
              <button onClick={addClient} className="btn-primary">Dodaj</button>
              <button onClick={() => setAdding(false)} className="btn-secondary">Anuluj</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── PACKAGE SIZES ─────────────────────────────────────────────────────────────
function PackageSizes() {
  return (
    <div>
      <h1 className="text-2xl font-bold text-gray-800 mb-2">Rozmiary Opakowań / Package Size Reference</h1>
      <p className="text-sm text-gray-500 mb-6">Notatki od Furkana — użyj prawidłowego rozmiaru przy każdej przesyłce, aby uniknąć sporów z kurierami.</p>
      <div className="bg-white rounded-xl shadow-sm overflow-hidden mb-6">
        <table className="w-full text-sm">
          <thead className="bg-gray-50 text-gray-500 text-xs">
            <tr>
              <th className="text-left px-5 py-3">Typ opakowania</th>
              <th className="text-left px-5 py-3">Wymiary (cm)</th>
              <th className="text-left px-5 py-3">Waga (kg)</th>
              <th className="text-left px-5 py-3">Tkaniny / zastosowanie</th>
            </tr>
          </thead>
          <tbody>
            {PACKAGE_SIZES.map((p, i) => (
              <tr key={i} className="table-row border-t">
                <td className="px-5 py-3 font-semibold text-blue-800">{p.type}</td>
                <td className="px-5 py-3 font-mono text-gray-600">{p.dims}</td>
                <td className="px-5 py-3 text-gray-600">{p.weight}</td>
                <td className="px-5 py-3 text-gray-500">{p.fabrics}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="bg-blue-50 border border-blue-200 rounded-xl p-5 text-sm text-blue-800">
        <strong>Zasada:</strong> Zawsze zadeklaruj dokładny rozmiar i wagę przy zamawianiu kuriera. Każde odstępstwo = ryzyko nadpłaty. Przy wątpliwościach — zaokrąglij W GÓRĘ, nigdy w dół.
        <br/><br/>
        <strong>Kurierzy dostępni w Polsce:</strong> DPD (kolor czerwony) • InPost (paczkomaty — żółty) • GLS (niebieski) • DHL (żółto-czerwony) • UPS (brązowy) • ORLEN Paczka (zielony)
        <br/><br/>
        <strong>Zablokowany kurierzy (Furkan):</strong> GLS — tymczasowo zablokowany z powodu sporów
      </div>
    </div>
  );
}

// ── APP ROOT ──────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("dashboard");
  const [orders, setOrders] = useLocalStorage("tw_orders", INITIAL_ORDERS);
  const [inventory, setInventory] = useLocalStorage("tw_inventory", INITIAL_INVENTORY);
  const [b2b, setB2b] = useLocalStorage("tw_b2b", INITIAL_B2B);

  const renderTab = () => {
    switch (tab) {
      case "dashboard": return <Dashboard orders={orders} inventory={inventory} b2b={b2b} />;
      case "orders": return <Orders orders={orders} setOrders={setOrders} />;
      case "disputes": return <Disputes orders={orders} setOrders={setOrders} />;
      case "couriers": return <CourierStats orders={orders} />;
      case "inventory": return <Inventory inventory={inventory} setInventory={setInventory} />;
      case "b2b": return <B2B b2b={b2b} setB2b={setB2b} />;
      case "packages": return <PackageSizes />;
      default: return null;
    }
  };

  return (
    <div className="flex">
      <Sidebar active={tab} setActive={setTab} />
      <div className="main p-8 overflow-y-auto">
        <div className="max-w-5xl mx-auto">
          {renderTab()}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
