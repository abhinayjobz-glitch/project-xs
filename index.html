function useLocalStorage(key, initial) {
  const [state, setState] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : initial; }
    catch { return initial; }
  });
  const set = useCallback(v => { setState(v); try { localStorage.setItem(key, JSON.stringify(v)); } catch {} }, [key]);
  return [state, set];
}

function CourierBadge({ courier }) {
  const map = { DPD: "badge-dpd", InPost: "badge-inpost", GLS: "badge-gls", DHL: "badge-dhl", UPS: "badge-ups", "ORLEN Paczka": "badge-orlen" };
  return <span className={`inline-block px-2 py-0.5 rounded text-xs font-bold ${map[courier] || "bg-gray-200 text-gray-700"}`}>{courier}</span>;
}

function StatusBadge({ status }) {
  const map = { Open: "dispute-open", Submitted: "dispute-submitted", Won: "dispute-won", Lost: "dispute-lost" };
  if (!status) return <span className="text-gray-400 text-sm">—</span>;
  return <span className={map[status] || "text-gray-600"}>{status}</span>;
}

// ── DISPUTES ──────────────────────────────────────────────────────────────────
function Disputes({ orders, setOrders }) {
  const [editing, setEditing] = useState(null);
  const disputes = orders.filter(o => o.dispute_amount > 0 || o.dispute_status);
  const openEdit = (o) => setEditing({ ...o });
  const saveEdit = () => {
    setOrders(orders.map(o => o.id === editing.id ? editing : o));
    setEditing(null);
  };

  return (
    <div>
      <h1 className="text-2xl font-bold text-gray-800 mb-2">Spory Kurierskie / Courier Disputes</h1>
      <p className="text-gray-500 text-sm mb-6">Zarządzaj sporami z DPD, GLS, InPost i innymi. Wiersze czerwone = potwierdzona nadpłata.</p>
      <div className="grid grid-cols-3 gap-4 mb-6">
        {["Open","Submitted","Won"].map(s => {
          const count = disputes.filter(d => d.dispute_status === s).length;
          const amt = disputes.filter(d => d.dispute_status === s).reduce((a,d) => a + (d.dispute_amount||0), 0);
          return (
            <div key={s} className="stat-card text-center">
              <div className={`text-2xl font-bold ${s==="Open"?"text-red-600":s==="Submitted"?"text-yellow-600":"text-green-600"}`}>{count}</div>
              <div className="text-sm text-gray-500">{s}</div>
              {amt > 0 && <div className="text-xs text-gray-400">{amt.toFixed(2)} PLN</div>}
            </div>
          );
        })}
      </div>
      <div className="bg-white rounded-xl shadow-sm overflow-hidden">
        <table className="w-full text-sm">
          <thead className="bg-gray-50 text-gray-500 text-xs">
            <tr>
              <th className="text-left px-4 py-3">Zamówienie</th>
              <th className="text-left px-4 py-3">Klient</th>
              <th className="text-left px-4 py-3">Kurier</th>
              <th className="text-left px-4 py-3">Waga dekl.</th>
              <th className="text-left px-4 py-3">Waga nalic.</th>
              <th className="text-left px-4 py-3">Różnica</th>
              <th className="text-left px-4 py-3">Nadpłata</th>
              <th className="text-left px-4 py-3">Status</th>
              <th className="text-left px-4 py-3"></th>
            </tr>
          </thead>
          <tbody>
            {disputes.map(o => {
              const diff = (o.weight_billed - o.weight_declared).toFixed(2);
              const flagged = o.weight_billed > o.weight_declared;
              return (
                <tr key={o.id} className={`table-row border-t ${flagged && o.dispute_status === "Open" ? "bg-red-50" : ""}`}>
                  <td className="px-4 py-3 font-mono font-semibold text-blue-700">{o.id}</td>
                  <td className="px-4 py-3 text-gray-600">{o.customer}</td>
                  <td className="px-4 py-3"><CourierBadge courier={o.courier} /></td>
                  <td className="px-4 py-3">{o.weight_declared} kg</td>
                  <td className="px-4 py-3 font-semibold">{o.weight_billed} kg</td>
                  <td className={`px-4 py-3 font-bold ${diff > 0 ? "text-red-600" : "text-green-600"}`}>{diff > 0 ? `+${diff}` : diff} kg {diff > 0 && "🚨"}</td>
                  <td className="px-4 py-3 font-bold text-red-600">{o.dispute_amount > 0 ? `${o.dispute_amount.toFixed(2)} PLN` : "—"}</td>
                  <td className="px-4 py-3"><StatusBadge status={o.dispute_status} /></td>
                  <td className="px-4 py-3"><button onClick={() => openEdit(o)} className="btn-secondary text-xs py-1 px-2">Edytuj</button></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {editing && (
        <div className="modal-overlay" onClick={() => setEditing(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h2 className="text-lg font-bold text-gray-800 mb-4">Edytuj spór — {editing.id}</h2>
            <div className="grid grid-cols-2 gap-4 mb-4">
              <div><label className="block text-xs text-gray-500 mb-1">Waga zadeklarowana (kg)</label><input type="number" step="0.1" value={editing.weight_declared} onChange={e => setEditing({...editing, weight_declared: parseFloat(e.target.value)||0})} /></div>
              <div><label className="block text-xs text-gray-500 mb-1">Waga naliczona (kg)</label><input type="number" step="0.1" value={editing.weight_billed} onChange={e => setEditing({...editing, weight_billed: parseFloat(e.target.value)||0})} /></div>
              <div><label className="block text-xs text-gray-500 mb-1">Kwota nadpłaty (PLN)</label><input type="number" step="0.01" value={editing.dispute_amount} onChange={e => setEditing({...editing, dispute_amount: parseFloat(e.target.value)||0})} /></div>
              <div><label className="block text-xs text-gray-500 mb-1">Status sporu</label>
                <select value={editing.dispute_status||""} onChange={e => setEditing({...editing, dispute_status: e.target.value||null})}>
                  <option value="">Brak sporu</option>
                  <option value="Open">Open</option>
                  <option value="Submitted">Submitted</option>
                  <option value="Won">Won</option>
                  <option value="Lost">Lost</option>
                </select>
              </div>
            </div>
            <div className="mb-4"><label className="block text-xs text-gray-500 mb-1">Notatki</label><textarea rows={3} value={editing.notes} onChange={e => setEditing({...editing, notes: e.target.value})} className="resize-none" /></div>
            <div className="flex gap-3">
              <button onClick={saveEdit} className="btn-primary">Zapisz</button>
              <button onClick={() => setEditing(null)} className="btn-secondary">Anuluj</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── COURIER STATS ─────────────────────────────────────────────────────────────
function CourierStats({ orders }) {
  const couriers = ["DPD", "InPost", "GLS", "DHL", "UPS", "ORLEN Paczka"];
  const stats = couriers.map(c => {
    const co = orders.filter(o => o.courier === c);
    const disputes = co.filter(o => o.dispute_amount > 0);
    const won = co.filter(o => o.dispute_status === "Won");
    const open = co.filter(o => o.dispute_status === "Open");
    const totalOvercharge = disputes.reduce((s, o) => s + (o.dispute_amount || 0), 0);
    return { courier: c, total: co.length, disputes: disputes.length, open: open.length, won: won.length, overcharge: totalOvercharge };
  }).filter(s => s.total > 0);

  return (
    <div>
      <h1 className="text-2xl font-bold text-gray-800 mb-6">Statystyki Kurierów / Courier Performance</h1>
      <div className="grid gap-4">
        {stats.map(s => (
          <div key={s.courier} className={`bg-white rounded-xl p-5 shadow-sm border-l-4 ${s.overcharge > 0 ? "border-red-400" : "border-green-400"}`}>
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-center gap-3"><CourierBadge courier={s.courier} /><span className="font-semibold text-gray-700">{s.courier}</span></div>
              {s.overcharge > 0 && <span className="text-red-600 font-bold">{s.overcharge.toFixed(2)} PLN nadpłaty</span>}
            </div>
            <div className="grid grid-cols-4 gap-4 text-center">
              <div><div className="text-xl font-bold text-gray-700">{s.total}</div><div className="text-xs text-gray-400">Przesyłki</div></div>
              <div><div className={`text-xl font-bold ${s.disputes > 0 ? "text-red-500" : "text-green-500"}`}>{s.disputes}</div><div className="text-xs text-gray-400">Spory</div></div>
              <div><div className={`text-xl font-bold ${s.open > 0 ? "text-red-500" : "text-gray-500"}`}>{s.open}</div><div className="text-xs text-gray-400">Otwarte</div></div>
              <div><div className="text-xl font-bold text-green-600">{s.won}</div><div className="text-xs text-gray-400">Wygrane</div></div>
            </div>
            {s.disputes > 0 && (
              <div className="mt-3 pt-3 border-t border-gray-100 text-xs text-gray-500">
                Win rate: <strong>{Math.round((s.won/s.disputes)*100)}%</strong> | Śr. nadpłata: <strong>{(s.overcharge/s.disputes).toFixed(2)} PLN/spór</strong>
              </div>
            )}
          </div>
        ))}
      </div>
      <div className="bg-white rounded-xl p-6 shadow-sm mt-6">
        <h2 className="font-semibold text-gray-700 mb-3">Instrukcja zbierania dowodów</h2>
        <div className="space-y-2 text-sm text-gray-600">
          {["Przed wysyłką: zrób zdjęcie paczki na wadze","Przed wysyłką: zdjęcie wymiarów taśmą mierniczą","Zachowaj PDF potwierdzenia zlecenia z wagą i wymiarami","Zachowaj etykietę kurierską","Po fakturze: porównaj wagę zadeklarowaną vs naliczoną","Różnica > 0 kg — otwórz spór w ciągu 7 dni"].map((s,i) => (
            <div key={i} className="flex items-start gap-2"><span className="text-blue-600 font-bold">{i+1}.</span><span>{s}</span></div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── EVIDENCE & INVOICE COMPARISON ─────────────────────────────────────────────
function Evidence({ evidence, setEvidence }) {
  const [selected, setSelected] = useState(null);
  const [summary, setSummary] = useState(null);

  const toggleCheck = (evId, itemIdx) => {
    setEvidence(evidence.map(e => {
      if (e.id !== evId) return e;
      const cl = e.evidence_checklist.map((c, i) => i === itemIdx ? { ...c, done: !c.done } : c);
      return { ...e, evidence_checklist: cl };
    }));
    if (selected && selected.id === evId) {
      setSelected(prev => {
        const cl = prev.evidence_checklist.map((c, i) => i === itemIdx ? { ...c, done: !c.done } : c);
        return { ...prev, evidence_checklist: cl };
      });
    }
  };

  const generateSummary = (ev) => {
    const done = ev.evidence_checklist.filter(c => c.done).map(c => `  - [x] ${c.item}`).join("\n");
    const notDone = ev.evidence_checklist.filter(c => !c.done).map(c => `  - [ ] ${c.item}`).join("\n");
    const text = `DISPUTE EVIDENCE SUMMARY
========================
Evidence ID: ${ev.id}
Courier: ${ev.courier}
Order ID: ${ev.order_id}
Invoice Number: ${ev.invoice_number}
Invoice Date: ${ev.invoice_date}

WEIGHT DISCREPANCY:
  Declared weight: ${ev.declared_weight} kg
  Billed weight:   ${ev.billed_weight} kg
  Difference:      +${(ev.billed_weight - ev.declared_weight).toFixed(2)} kg
  Overcharge:      ${ev.overcharge_amount.toFixed(2)} PLN

DIMENSIONS:
  Declared: ${ev.declared_dims} cm
  Billed:   ${ev.billed_dims} cm

STATUS: ${ev.status}

EVIDENCE COLLECTED:
${done || "  (none yet)"}

STILL NEEDED:
${notDone || "  (all collected)"}

NOTES:
${ev.notes || "(none)"}

Generated: ${new Date().toLocaleString("pl-PL")}`;
    setSummary(text);
  };

  const totalOvercharge = evidence.reduce((s, e) => s + e.overcharge_amount, 0);
  const openCount = evidence.filter(e => e.status === "Open").length;

  return (
    <div>
      <h1 className="text-2xl font-bold text-gray-800 mb-2">Faktury / Evidence & Invoice Comparison</h1>
      <p className="text-gray-500 text-sm mb-6">Porównanie faktur kurierskich z zadeklarowanymi wagami. Czerwone = otwarta nadpłata.</p>

      <div className="grid grid-cols-3 gap-4 mb-6">
        <div className="stat-card text-center"><div className="text-2xl font-bold text-red-600">{openCount}</div><div className="text-sm text-gray-500">Otwarte spory</div></div>
        <div className="stat-card text-center"><div className="text-2xl font-bold text-yellow-600">{evidence.filter(e=>e.status==="Submitted").length}</div><div className="text-sm text-gray-500">Submitted</div></div>
        <div className="stat-card text-center"><div className="text-2xl font-bold text-red-700">{totalOvercharge.toFixed(2)} PLN</div><div className="text-sm text-gray-500">Łączna nadpłata</div></div>
      </div>

      <div className="bg-white rounded-xl shadow-sm overflow-hidden mb-6">
        <table className="w-full text-sm">
          <thead className="bg-gray-50 text-gray-500 text-xs">
            <tr>
              <th className="text-left px-4 py-3">ID</th>
              <th className="text-left px-4 py-3">Kurier</th>
              <th className="text-left px-4 py-3">Zamówienie</th>
              <th className="text-left px-4 py-3">Nr faktury</th>
              <th className="text-left px-4 py-3">Waga dekl.</th>
              <th className="text-left px-4 py-3">Waga fakt.</th>
              <th className="text-left px-4 py-3">Nadpłata</th>
              <th className="text-left px-4 py-3">Checklist</th>
              <th className="text-left px-4 py-3">Status</th>
              <th className="text-left px-4 py-3"></th>
            </tr>
          </thead>
          <tbody>
            {evidence.map(ev => {
              const doneCount = ev.evidence_checklist.filter(c => c.done).length;
              const total = ev.evidence_checklist.length;
              const isRedRow = ev.overcharge_amount > 0 && ev.status === "Open";
              return (
                <tr key={ev.id} className={`table-row border-t cursor-pointer ${isRedRow ? "bg-red-50" : ""}`} onClick={() => setSelected(selected && selected.id === ev.id ? null : ev)}>
                  <td className="px-4 py-3 font-mono text-xs font-bold text-blue-700">{ev.id}</td>
                  <td className="px-4 py-3"><CourierBadge courier={ev.courier} /></td>
                  <td className="px-4 py-3 font-mono text-xs text-gray-600">{ev.order_id}</td>
                  <td className="px-4 py-3 text-xs text-gray-500">{ev.invoice_number}</td>
                  <td className="px-4 py-3">{ev.declared_weight} kg</td>
                  <td className="px-4 py-3 font-semibold text-red-600">{ev.billed_weight} kg</td>
                  <td className="px-4 py-3 font-bold text-red-600">{ev.overcharge_amount.toFixed(2)} PLN</td>
                  <td className="px-4 py-3">
                    <div className="flex items-center gap-1">
                      <div className="w-20 bg-gray-200 rounded-full h-2">
                        <div className="bg-green-500 h-2 rounded-full" style={{width: `${(doneCount/total)*100}%`}}></div>
                      </div>
                      <span className="text-xs text-gray-500">{doneCount}/{total}</span>
                    </div>
                  </td>
                  <td className="px-4 py-3"><StatusBadge status={ev.status} /></td>
                  <td className="px-4 py-3 text-xs text-blue-600">{selected && selected.id === ev.id ? "▲ Zamknij" : "▼ Szczegóły"}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {selected && (
        <div className="bg-white rounded-xl p-6 shadow-sm mb-6">
          <div className="flex items-start justify-between mb-4">
            <div>
              <h2 className="text-lg font-bold text-gray-800">{selected.id} — {selected.courier} / {selected.order_id}</h2>
              <p className="text-gray-500 text-sm">Faktura: {selected.invoice_number} z dnia {selected.invoice_date}</p>
            </div>
            <button onClick={() => generateSummary(selected)} className="btn-gold text-sm">📋 Generate Evidence Summary</button>
          </div>

          <div className="grid grid-cols-2 gap-6 mb-6">
            <div className="bg-gray-50 rounded-lg p-4">
              <div className="text-xs text-gray-500 font-semibold mb-2 uppercase">Zadeklarowane</div>
              <div className="text-2xl font-bold text-green-600">{selected.declared_weight} kg</div>
              <div className="text-sm text-gray-500 mt-1">Wymiary: {selected.declared_dims} cm</div>
            </div>
            <div className="bg-red-50 rounded-lg p-4">
              <div className="text-xs text-gray-500 font-semibold mb-2 uppercase">Naliczone przez kuriera</div>
              <div className="text-2xl font-bold text-red-600">{selected.billed_weight} kg</div>
              <div className="text-sm text-gray-500 mt-1">Wymiary: {selected.billed_dims} cm</div>
              <div className="text-sm font-bold text-red-700 mt-2">Nadpłata: {selected.overcharge_amount.toFixed(2)} PLN (+{(selected.billed_weight - selected.declared_weight).toFixed(2)} kg)</div>
            </div>
          </div>

          <h3 className="font-semibold text-gray-700 mb-3">Evidence Checklist</h3>
          <div className="space-y-2 mb-4">
            {selected.evidence_checklist.map((c, i) => (
              <label key={i} className={`flex items-center gap-3 p-3 rounded-lg cursor-pointer transition-colors ${c.done ? "bg-green-50 border border-green-200" : "bg-gray-50 border border-gray-200"}`}>
                <input type="checkbox" checked={c.done} onChange={() => toggleCheck(selected.id, i)} className="w-4 h-4 accent-green-600" style={{width:"auto"}} />
                <span className={`text-sm ${c.done ? "text-green-700 line-through" : "text-gray-700"}`}>{c.item}</span>
                {c.done && <span className="ml-auto text-green-600 text-xs font-bold">✓ Done</span>}
              </label>
            ))}
          </div>

          {selected.notes && <div className="bg-blue-50 rounded-lg p-3 text-sm text-blue-700"><strong>Notes:</strong> {selected.notes}</div>}
        </div>
      )}

      {summary && (
        <div className="modal-overlay" onClick={() => setSummary(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h2 className="text-lg font-bold text-gray-800 mb-4">Evidence Summary — Copy & Paste to Courier</h2>
            <textarea className="w-full font-mono text-xs bg-gray-50 rounded p-3 resize-none" rows={28} value={summary} readOnly />
            <div className="flex gap-3 mt-4">
              <button onClick={() => {navigator.clipboard && navigator.clipboard.writeText(summary)}} className="btn-primary">📋 Kopiuj do schowka</button>
              <button onClick={() => setSummary(null)} className="btn-secondary">Zamknij</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── WEBSITE ISSUES TRACKER ────────────────────────────────────────────────────
function WebsiteIssues({ issues, setIssues }) {
  const [adding, setAdding] = useState(false);
  const [form, setForm] = useState({ type: "Pre-Order Bug", product_or_page: "", priority: "High", description: "", fix_action: "" });

  const priorityColor = { Critical: "bg-red-100 text-red-700 border border-red-300", High: "bg-orange-100 text-orange-700 border border-orange-300", Medium: "bg-yellow-100 text-yellow-700 border border-yellow-300" };
  const statusColor = { Open: "bg-red-50 border-red-200", "In Progress": "bg-blue-50 border-blue-200", Fixed: "bg-green-50 border-green-200" };

  const markFixed = (id) => setIssues(issues.map(i => i.id === id ? { ...i, status: "Fixed" } : i));
  const markInProgress = (id) => setIssues(issues.map(i => i.id === id ? { ...i, status: "In Progress" } : i));
  const markOpen = (id) => setIssues(issues.map(i => i.id === id ? { ...i, status: "Open" } : i));

  const addIssue = () => {
    if (!form.product_or_page) return;
    setIssues([...issues, { ...form, id: Date.now(), status: "Open", date_found: new Date().toISOString().slice(0,10) }]);
    setAdding(false);
    setForm({ type: "Pre-Order Bug", product_or_page: "", priority: "High", description: "", fix_action: "" });
  };

  const openIssues = issues.filter(i => i.status !== "Fixed");
  const criticalCount = issues.filter(i => i.priority === "Critical" && i.status !== "Fixed").length;

  return (
    <div>
      <div className="flex items-start justify-between mb-6">
        <div>
          <h1 className="text-2xl font-bold text-gray-800">Błędy Strony / Website Issues Tracker</h1>
          <p className="text-gray-500 text-sm mt-1">Śledzenie błędów na stronie Shopify i marketplace.</p>
        </div>
        <button onClick={() => setAdding(true)} className="btn-primary">+ Dodaj błąd</button>
      </div>

      <div className="grid grid-cols-3 gap-4 mb-6">
        <div className="stat-card border-l-4 border-red-500">
          <div className="text-2xl font-bold text-red-600">{openIssues.length}</div>
          <div className="text-sm text-gray-500">Otwarte błędy</div>
        </div>
        <div className="stat-card border-l-4 border-red-800">
          <div className="text-2xl font-bold text-red-800">{criticalCount}</div>
          <div className="text-sm text-gray-500">Krytyczne (Critical)</div>
        </div>
        <div className="stat-card border-l-4 border-green-500">
          <div className="text-2xl font-bold text-green-600">{issues.filter(i=>i.status==="Fixed").length}</div>
          <div className="text-sm text-gray-500">Naprawione (Fixed)</div>
        </div>
      </div>

      <div className="space-y-3">
        {issues.map(issue => (
          <div key={issue.id} className={`bg-white rounded-xl p-5 shadow-sm border ${issue.status === "Fixed" ? "border-green-200 bg-green-50 opacity-70" : "border-gray-100"}`}>
            <div className="flex items-start justify-between gap-4">
              <div className="flex-1">
                <div className="flex items-center gap-2 flex-wrap mb-1">
                  <span className={`px-2 py-0.5 rounded text-xs font-bold ${priorityColor[issue.priority] || "bg-gray-100 text-gray-600"}`}>{issue.priority}</span>
                  <span className="px-2 py-0.5 rounded text-xs bg-blue-100 text-blue-700">{issue.type}</span>
                  {issue.status === "Fixed" && <span className="px-2 py-0.5 rounded text-xs bg-green-600 text-white font-bold">✓ Fixed</span>}
                  {issue.status === "In Progress" && <span className="px-2 py-0.5 rounded text-xs bg-blue-600 text-white font-bold">⚡ In Progress</span>}
                </div>
                <div className="font-semibold text-gray-800 text-sm">{issue.product_or_page}</div>
                <div className="text-gray-600 text-sm mt-1">{issue.description}</div>
                {issue.fix_action && <div className="text-blue-700 text-xs mt-1 bg-blue-50 rounded px-2 py-1">🔧 Fix: {issue.fix_action}</div>}
                <div className="text-gray-400 text-xs mt-1">Znaleziono: {issue.date_found}</div>
              </div>
              <div className="flex flex-col gap-1 min-w-max">
                {issue.status !== "Fixed" && <button onClick={() => markFixed(issue.id)} className="btn-primary text-xs py-1 px-2">✓ Mark Fixed</button>}
                {issue.status === "Open" && <button onClick={() => markInProgress(issue.id)} className="btn-secondary text-xs py-1 px-2">⚡ In Progress</button>}
                {issue.status === "Fixed" && <button onClick={() => markOpen(issue.id)} className="btn-secondary text-xs py-1 px-2">↩ Reopen</button>}
              </div>
            </div>
          </div>
        ))}
      </div>

      {adding && (
        <div className="modal-overlay" onClick={() => setAdding(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h2 className="text-lg font-bold text-gray-800 mb-4">Dodaj nowy błąd strony</h2>
            <div className="space-y-3">
              <div className="grid grid-cols-2 gap-3">
                <div><label className="block text-xs text-gray-500 mb-1">Typ błędu</label>
                  <select value={form.type} onChange={e => setForm({...form, type: e.target.value})}>
                    {["Pre-Order Bug","No Buy Button","Translation","Currency","Missing Image","SEO","SEO/Encoding","Other"].map(t=><option key={t}>{t}</option>)}
                  </select>
                </div>
                <div><label className="block text-xs text-gray-500 mb-1">Priorytet</label>
                  <select value={form.priority} onChange={e => setForm({...form, priority: e.target.value})}>
                    {["Critical","High","Medium"].map(p=><option key={p}>{p}</option>)}
                  </select>
                </div>
              </div>
              <div><label className="block text-xs text-gray-500 mb-1">Produkt / Strona</label><input value={form.product_or_page} onChange={e => setForm({...form, product_or_page: e.target.value})} /></div>
              <div><label className="block text-xs text-gray-500 mb-1">Opis błędu</label><textarea rows={2} className="resize-none" value={form.description} onChange={e => setForm({...form, description: e.target.value})} /></div>

            </div>
            <div className="flex gap-3 mt-4">
              <button onClick={addIssue} className="btn-primary">Dodaj</button>
              <button onClick={() => setAdding(false)} className="btn-secondary">Anuluj</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── ALLEGRO MONITOR ───────────────────────────────────────────────────────────
function AllegroMonitor({ allegro, setAllegro }) {
  const activeCount = allegro.filter(p => p.listing_status === "Active").length;
  const outOfStockCount = allegro.filter(p => !p.stock_available).length;
  const totalOrders30d = allegro.reduce((s, p) => s + p.orders_30d, 0);

  const statusBadge = (s) => {
    if (s === "Active") return <span className="px-2 py-0.5 rounded text-xs bg-green-100 text-green-700 font-bold">Active</span>;
    if (s === "Paused") return <span className="px-2 py-0.5 rounded text-xs bg-gray-200 text-gray-600 font-bold">Paused</span>;
    if (s === "Out of Stock") return <span className="px-2 py-0.5 rounded text-xs bg-red-100 text-red-700 font-bold">Out of Stock</span>;
    return null;
  };

  return (
    <div>
      <h1 className="text-2xl font-bold text-gray-800 mb-2">Allegro Monitor</h1>
      <p className="text-gray-500 text-sm mb-6">Śledzenie listingów na Allegro — ceny, stany, konkurencja.</p>

      <div className="grid grid-cols-3 gap-4 mb-6">
        <div className="stat-card text-center"><div className="text-2xl font-bold text-green-600">{activeCount}</div><div className="text-sm text-gray-500">Aktywne listingi</div></div>
        <div className="stat-card text-center"><div className="text-2xl font-bold text-red-600">{outOfStockCount}</div><div className="text-sm text-gray-500">Brak towaru</div></div>
        <div className="stat-card text-center"><div className="text-2xl font-bold text-blue-700">{totalOrders30d}</div><div className="text-sm text-gray-500">Zamówienia (30d)</div></div>
      </div>

      <div className="space-y-3">
        {allegro.map(p => {
          const priceDiff = p.our_price - p.competitor_min_price;
          const cheaper = priceDiff < 0;
          const hasIssues = p.issues && p.issues.length > 0;
          return (
            <div key={p.id} className={`bg-white rounded-xl p-5 shadow-sm border-l-4 ${hasIssues ? "border-red-400" : "border-green-400"}`}>
              <div className="flex items-start justify-between gap-4 mb-3">
                <div className="flex-1">
                  <div className="font-semibold text-gray-800">{p.title}</div>
                  <div className="text-xs text-gray-400 font-mono mt-0.5">{p.allegro_id}</div>
                </div>
                <div className="flex items-center gap-2">
                  {statusBadge(p.listing_status)}
                  {!p.stock_available && <span className="px-2 py-0.5 rounded text-xs bg-red-600 text-white font-bold">BRAK STOCK</span>}
                </div>
              </div>
              <div className="grid grid-cols-4 gap-4 text-center mb-3">
                <div>
                  <div className="text-lg font-bold text-blue-800">{p.our_price.toFixed(2)} PLN</div>
                  <div className="text-xs text-gray-400">Nasza cena</div>
                </div>
                <div>
                  <div className="text-lg font-bold text-gray-600">{p.competitor_min_price.toFixed(2)} PLN</div>
                  <div className="text-xs text-gray-400">Konkurencja (min)</div>
                </div>
                <div>
                  <div className={`text-lg font-bold ${cheaper ? "text-green-600" : priceDiff === 0 ? "text-gray-500" : "text-red-600"}`}>
                    {priceDiff === 0 ? "=" : (cheaper ? "" : "+")}{priceDiff.toFixed(2)} PLN
                  </div>
                  <div className="text-xs text-gray-400">{cheaper ? "Tańsi ✓" : priceDiff === 0 ? "Równa cena" : "Drożsi ⚠"}</div>
                </div>
                <div>
                  <div className="text-lg font-bold text-gray-700">{p.orders_30d}</div>
                  <div className="text-xs text-gray-400">Zamówienia 30d</div>
                </div>
              </div>
              <div className="flex items-center gap-3 text-xs text-gray-400 mb-2">
                <span>👁 {p.views_30d.toLocaleString()} wyświetleń (30d)</span>
              </div>
              {hasIssues && (
                <div className="space-y-1">
                  {p.issues.map((iss, i) => (
                    <div key={i} className="flex items-center gap-2 bg-red-50 rounded px-3 py-1.5 text-xs text-red-700">
                      <span>⚠️</span><span>{iss}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── WAREHOUSE LABELS ──────────────────────────────────────────────────────────
function WarehouseLabels({ labels, setLabels }) {
  const [search, setSearch] = useState("");
  const [adding, setAdding] = useState(false);
  const [printLabel, setPrintLabel] = useState(null);
  const [form, setForm] = useState({ label_id: "", sku: "", fabric_name: "", color: "", width_cm: 150, roll_length_m: 0, location_row: "A", location_shelf: 1, location_position: "01", date_arrived: new Date().toISOString().slice(0,10), notes: "" });

  const rowColors = { A: "row-a", B: "row-b", C: "row-c", D: "row-d" };
  const rowBg = { A: "bg-blue-50", B: "bg-green-50", C: "bg-yellow-50", D: "bg-purple-50" };
  const rowText = { A: "text-blue-700", B: "text-green-700", C: "text-yellow-700", D: "text-purple-700" };

  const filtered = labels.filter(l => {
    if (!search) return true;
    return l.label_id.toLowerCase().includes(search.toLowerCase()) || l.fabric_name.toLowerCase().includes(search.toLowerCase());
  });

  const addLabel = () => {
    if (!form.label_id || !form.fabric_name) return;
    setLabels([...labels, { ...form, width_cm: Number(form.width_cm), roll_length_m: Number(form.roll_length_m), location_shelf: Number(form.location_shelf) }]);
    setAdding(false);
    setForm({ label_id: "", sku: "", fabric_name: "", color: "", width_cm: 150, roll_length_m: 0, location_row: "A", location_shelf: 1, location_position: "01", date_arrived: new Date().toISOString().slice(0,10), notes: "" });
  };

  const rowCounts = { A: labels.filter(l=>l.location_row==="A").length, B: labels.filter(l=>l.location_row==="B").length, C: labels.filter(l=>l.location_row==="C").length, D: labels.filter(l=>l.location_row==="D").length };

  return (
    <div>
      <div className="flex items-center justify-between mb-6">
        <div>
          <h1 className="text-2xl font-bold text-gray-800">Etykiety Magazyn / Warehouse Labels</h1>
          <p className="text-gray-500 text-sm mt-1">System etykietowania rolek w magazynie — Sękocin Nowy</p>
        </div>
        <button onClick={() => setAdding(true)} className="btn-primary">+ Dodaj etykietę</button>
      </div>

      <div className="grid grid-cols-4 gap-3 mb-6">
        {["A","B","C","D"].map(row => (
          <div key={row} className={`stat-card border-l-4 ${rowColors[row]}`}>
            <div className={`text-2xl font-bold ${rowText[row]}`}>{rowCounts[row]}</div>
            <div className="text-sm text-gray-500">Rząd {row}</div>
            <div className="text-xs text-gray-400">rolek</div>
          </div>
        ))}
      </div>

      <div className="mb-4">
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Szukaj po ID etykiety lub nazwie tkaniny..." className="w-80" />
      </div>

      <div className="grid gap-3">
        {filtered.map(label => (
          <div key={label.label_id} className={`bg-white rounded-xl p-4 shadow-sm border-l-4 ${rowColors[label.location_row]}`}>
            <div className="flex items-start justify-between">
              <div className="flex-1">
                <div className="flex items-center gap-3 mb-1">
                  <span className="font-mono font-bold text-gray-800 text-base">{label.label_id}</span>
                  <span className={`px-2 py-0.5 rounded text-xs font-bold ${rowBg[label.location_row]} ${rowText[label.location_row]}`}>Rząd {label.location_row}</span>
                  <span className="px-2 py-0.5 rounded text-xs bg-gray-100 text-gray-600">Półka {label.location_shelf} / Poz. {label.location_position}</span>
                </div>
                <div className="font-semibold text-gray-700">{label.fabric_name} — {label.color}</div>
                <div className="text-sm text-gray-500 mt-0.5">SKU: <span className="font-mono text-xs">{label.sku}</span> | Szerokość: {label.width_cm}cm | Długość: <span className={`font-bold ${label.roll_length_m === 0 ? "text-red-600" : "text-green-700"}`}>{label.roll_length_m}m</span></div>
                <div className="text-xs text-gray-400 mt-0.5">Przyjęto: {label.date_arrived}{label.notes && ` | ${label.notes}`}</div>
              </div>
              <button onClick={() => setPrintLabel(label)} className="btn-secondary text-xs py-1 px-3">🖨 Drukuj</button>
            </div>
          </div>
        ))}
      </div>

      {printLabel && (
        <div className="modal-overlay" onClick={() => setPrintLabel(null)}>
          <div className="modal" onClick={e => e.stopPropagation()} style={{width:"400px"}}>
            <div className={`border-4 rounded-xl p-6 mb-4 ${printLabel.location_row==="A"?"border-blue-500":printLabel.location_row==="B"?"border-green-500":printLabel.location_row==="C"?"border-yellow-500":"border-purple-500"}`}>
              <div className="text-center mb-4">
                <div className="text-xs text-gray-400 uppercase tracking-widest">TextilWorld — Magazyn</div>
                <div className="text-2xl font-bold font-mono mt-1">{printLabel.label_id}</div>
              </div>
              <div className="grid grid-cols-2 gap-3 text-sm">
                <div><div className="text-xs text-gray-400">Tkanina</div><div className="font-semibold">{printLabel.fabric_name}</div></div>
                <div><div className="text-xs text-gray-400">Kolor</div><div className="font-semibold">{printLabel.color}</div></div>
                <div><div className="text-xs text-gray-400">Szerokość</div><div className="font-semibold">{printLabel.width_cm} cm</div></div>
                <div><div className="text-xs text-gray-400">Długość rolki</div><div className="font-bold text-lg">{printLabel.roll_length_m} m</div></div>
                <div><div className="text-xs text-gray-400">Lokalizacja</div><div className="font-semibold">Rząd {printLabel.location_row} / Półka {printLabel.location_shelf} / Poz. {printLabel.location_position}</div></div>
                <div><div className="text-xs text-gray-400">Przyjęto</div><div className="font-semibold">{printLabel.date_arrived}</div></div>
              </div>
              {printLabel.notes && <div className="mt-3 text-xs text-gray-500 bg-gray-50 rounded p-2">{printLabel.notes}</div>}
              <div className="text-center mt-4 text-xs text-gray-400 font-mono">{printLabel.sku}</div>
            </div>
            <div className="flex gap-3">
              <button onClick={() => window.print()} className="btn-primary">🖨 Drukuj</button>
              <button onClick={() => setPrintLabel(null)} className="btn-secondary">Zamknij</button>
            </div>
          </div>
        </div>
      )}

      {adding && (
        <div className="modal-overlay" onClick={() => setAdding(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h2 className="text-lg font-bold text-gray-800 mb-4">Dodaj etykietę magazynową</h2>
            <div className="space-y-3">
              <div className="grid grid-cols-2 gap-3">
                <div><label className="block text-xs text-gray-500 mb-1">ID Etykiety (np. TW-A1-003)</label><input value={form.label_id} onChange={e => setForm({...form, label_id: e.target.value})} /></div>
                <div><label className="block text-xs text-gray-500 mb-1">SKU</label><input value={form.sku} onChange={e => setForm({...form, sku: e.target.value})} /></div>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className="block text-xs text-gray-500 mb-1">Nazwa tkaniny</label><input value={form.fabric_name} onChange={e => setForm({...form, fabric_name: e.target.value})} /></div>
                <div><label className="block text-xs text-gray-500 mb-1">Kolor</label><input value={form.color} onChange={e => setForm({...form, color: e.target.value})} /></div>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className="block text-xs text-gray-500 mb-1">Szerokość (cm)</label><input type="number" value={form.width_cm} onChange={e => setForm({...form, width_cm: e.target.value})} /></div>
                <div><label className="block text-xs text-gray-500 mb-1">Długość rolki (m)</label><input type="number" value={form.roll_length_m} onChange={e => setForm({...form, roll_length_m: e.target.value})} /></div>
              </div>
              <div className="grid grid-cols-3 gap-3">
                <div><label className="block text-xs text-gray-500 mb-1">Rząd</label>
                  <select value={form.location_row} onChange={e => setForm({...form, location_row: e.target.value})}>
                    {["A","B","C","D"].map(r=><option key={r}>{r}</option>)}
                  </select>
                </div>
                <div><label className="block text-xs text-gray-500 mb-1">Półka (1-5)</label><input type="number" min="1" max="5" value={form.location_shelf} onChange={e => setForm({...form, location_shelf: e.target.value})} /></div>
                <div><label className="block text-xs text-gray-500 mb-1">Pozycja</label><input value={form.location_position} onChange={e => setForm({...form, location_position: e.target.value})} /></div>
              </div>
              <div><label className="block text-xs text-gray-500 mb-1">Data przyjęcia</label><input type="date" value={form.date_arrived} onChange={e => setForm({...form, date_arrived: e.target.value})} /></div>
              <div><label className="block text-xs text-gray-500 mb-1">Notatki</label><textarea rows={2} className="resize-none" value={form.notes} onChange={e => setForm({...form, notes: e.target.value})} /></div>
            </div>
            <div className="flex gap-3 mt-4">
              <button onClick={addLabel} className="btn-primary">Dodaj</button>
              <button onClick={() => setAdding(false)} className="btn-secondary">Anuluj</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── CUSTOMER SEGMENTS (B2C) ───────────────────────────────────────────────────
function CustomerSegments({ segments, setSegments }) {
  const [editingNote, setEditingNote] = useState(null);
  const [noteText, setNoteText] = useState("");

  const channelBadge = (ch) => {
    const colors = { Allegro: "bg-orange-100 text-orange-700", Shopify: "bg-green-100 text-green-700", Etsy: "bg-pink-100 text-pink-700", "B2B Direct": "bg-blue-100 text-blue-700" };
    return <span key={ch} className={`px-2 py-0.5 rounded text-xs font-medium ${colors[ch]||"bg-gray-100 text-gray-600"}`}>{ch}</span>;
  };

  const saveNote = (id) => {
    setSegments(segments.map(s => s.id === id ? { ...s, notes: noteText } : s));
    setEditingNote(null);
  };

  const totalPotential = segments.reduce((s, seg) => s + seg.potential_monthly_value, 0);

  return (
    <div>
      <h1 className="text-2xl font-bold text-gray-800 mb-2">Segmenty B2C / Customer Segments</h1>
      <p className="text-gray-500 text-sm mb-6">Segmenty klientów B2C — strategie i kanały sprzedaży. Z notatek CEO.</p>

      <div className="grid grid-cols-2 gap-4 mb-6">
        <div className="stat-card">
          <div className="text-2xl font-bold text-blue-800">{segments.length}</div>
          <div className="text-sm text-gray-500">Segmenty B2C</div>
        </div>
        <div className="stat-card">
          <div className="text-2xl font-bold text-green-600">{totalPotential.toLocaleString()} PLN</div>
          <div className="text-sm text-gray-500">Potencjał łączny / mies.</div>
        </div>
      </div>

      {/* Marketplace presence */}
      <div className="bg-white rounded-xl p-5 shadow-sm mb-6">
        <h2 className="font-semibold text-gray-700 mb-3">Presence na Marketplace</h2>
        <div className="grid grid-cols-3 gap-3">
          {MARKETPLACE_PRESENCE.map(m => (
            <div key={m.name} className={`flex items-center gap-2 rounded-lg px-4 py-3 ${m.active ? "bg-green-50 border border-green-200" : "bg-gray-50 border border-gray-200"}`}>
              <span className={`text-lg ${m.active ? "text-green-600" : "text-gray-400"}`}>{m.active ? "✓" : "–"}</span>
              <div>
                <div className={`font-semibold text-sm ${m.active ? "text-green-800" : "text-gray-400"}`}>{m.name}</div>
                <div className={`text-xs ${m.active ? "text-green-600" : "text-gray-400"}`}>{m.active ? "Aktywny" : "Nieaktywny"}</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div className="space-y-4">
        {segments.map(seg => (
          <div key={seg.id} className="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
            <div className="flex items-start justify-between mb-3">
              <div className="flex-1">
                <div className="flex items-center gap-2 mb-1">
                  <h3 className="font-bold text-gray-800 text-base">{seg.name}</h3>
                  <span className="px-2 py-0.5 rounded text-xs bg-blue-100 text-blue-700 font-semibold">{seg.potential_monthly_value.toLocaleString()} PLN/mies.</span>
                </div>
                <p className="text-gray-600 text-sm">{seg.description}</p>
              </div>
            </div>
            <div className="grid grid-cols-3 gap-4 mb-3 text-sm">
              <div><div className="text-xs text-gray-400 mb-0.5">Śr. zamówienie</div><div className="font-semibold text-gray-700">{seg.avg_order_size}</div></div>
              <div><div className="text-xs text-gray-400 mb-0.5">Częstotliwość</div><div className="font-semibold text-gray-700">{seg.buying_frequency}</div></div>
              <div><div className="text-xs text-gray-400 mb-0.5">Kanały</div><div className="flex gap-1 flex-wrap">{seg.channels.map(c => channelBadge(c))}</div></div>
            </div>
            <div className="bg-blue-50 rounded-lg px-4 py-3 mb-3">
              <div className="text-xs text-blue-500 font-semibold mb-0.5 uppercase">Strategia</div>
              <div className="text-blue-800 text-sm">{seg.strategy}</div>
            </div>
            <div className="flex items-start gap-2">
              <div className="flex-1">
                {editingNote === seg.id ? (
                  <div className="flex gap-2">
                    <textarea className="resize-none text-sm flex-1" rows={2} value={noteText} onChange={e => setNoteText(e.target.value)} placeholder="Notatki..." />
                    <div className="flex flex-col gap-1">
                      <button onClick={() => saveNote(seg.id)} className="btn-primary text-xs py-1 px-2">Zapisz</button>
                      <button onClick={() => setEditingNote(null)} className="btn-secondary text-xs py-1 px-2">Anuluj</button>
                    </div>
                  </div>
                ) : (
                  <div className="flex items-center gap-2">
                    {seg.notes ? <div className="text-sm text-gray-500 bg-gray-50 rounded px-3 py-2 flex-1">{seg.notes}</div> : <div className="text-sm text-gray-300 italic">Brak notatek — kliknij aby dodać</div>}
                    <button onClick={() => { setEditingNote(seg.id); setNoteText(seg.notes || ""); }} className="btn-secondary text-xs py-1 px-2">✏️ Notatka</button>
                  </div>
                )}
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── APP ROOT ──────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("dashboard");
  const [orders, setOrders] = useLocalStorage("tw_orders", INITIAL_ORDERS);
  const [inventory, setInventory] = useLocalStorage("tw_inventory", INITIAL_INVENTORY);
  const [b2b, setB2b] = useLocalStorage("tw_b2b", INITIAL_B2B);
  const [evidence, setEvidence] = useLocalStorage("tw_evidence", INITIAL_EVIDENCE);
  const [websiteIssues, setWebsiteIssues] = useLocalStorage("tw_website_issues", INITIAL_WEBSITE_ISSUES);
  const [allegro, setAllegro] = useLocalStorage("tw_allegro", INITIAL_ALLEGRO);
  const [warehouseLabels, setWarehouseLabels] = useLocalStorage("tw_warehouse_labels", INITIAL_WAREHOUSE_LABELS);
  const [segments, setSegments] = useLocalStorage("tw_segments", INITIAL_SEGMENTS);

  const renderTab = () => {
    switch (tab) {
      case "dashboard": return <Dashboard orders={orders} inventory={inventory} b2b={b2b} websiteIssues={websiteIssues} />;
      case "orders": return <Orders orders={orders} setOrders={setOrders} />;
      case "disputes": return <Disputes orders={orders} setOrders={setOrders} />;
      case "couriers": return <CourierStats orders={orders} />;
      case "inventory": return <Inventory inventory={inventory} setInventory={setInventory} />;
      case "b2b": return <B2B b2b={b2b} setB2b={setB2b} />;
      case "packages": return <PackageSizes />;
      case "evidence": return <Evidence evidence={evidence} setEvidence={setEvidence} />;
      case "website": return <WebsiteIssues issues={websiteIssues} setIssues={setWebsiteIssues} />;
      case "allegro": return <AllegroMonitor allegro={allegro} setAllegro={setAllegro} />;
      case "warehouse": return <WarehouseLabels labels={warehouseLabels} setLabels={setWarehouseLabels} />;
      case "segments": return <CustomerSegments segments={segments} setSegments={setSegments} />;
      default: return null;
    }
  };

  return (
    <div className="flex">
      <Sidebar active={tab} setActive={setTab} />
      <div className="main p-8 overflow-y-auto">
        <div className="max-w-5xl mx-auto">
          {renderTab()}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
